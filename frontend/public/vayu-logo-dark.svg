<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vayu Drishti dark-mode logo</title>
  <desc id="desc">Teal circular Vayu Drishti emblem with off-white title and an icy blue IoT Telemetry subtitle on a transparent canvas.</desc>

  <defs>
    <linearGradient id="tealDisc" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#12B8B4"/>
      <stop offset="1" stop-color="#078E8D"/>
    </linearGradient>
  </defs>

  <!-- Transparent background by design. -->
  <circle cx="170" cy="180" r="136" fill="url(#tealDisc)"/>

  <!-- Vayu / sprouting-air emblem. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 127 C104 139 133 161 151 190 C164 211 168 235 168 281"/>
    <path d="M268 127 C236 139 207 161 189 190 C176 211 172 235 172 281"/>
    <path d="M91 105 C120 84 146 86 170 99 C194 86 220 84 249 105 C220 120 194 139 170 166 C146 139 120 120 91 105 Z"/>
    <path d="M112 126 C135 143 151 160 162 181"/>
    <path d="M228 126 C205 143 189 160 178 181"/>
  </g>

  <g font-family="Arial Narrow, Roboto Condensed, Helvetica Neue, Arial, sans-serif">
    <text x="350" y="174" fill="#F4F8FC" font-size="122" font-weight="700" letter-spacing="1">VAYU DRISHTI</text>
    <text x="354" y="272" fill="#AFC6D9" font-size="72" font-weight="400" letter-spacing="0.5">IoT Telemetry</text>
  </g>
</svg>
